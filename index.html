<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed & Yara's Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #fcf6f5;
    font-family: 'Playfair Display', serif;
    color: #2c2c2c;
    overflow-x: hidden;
  }

  /* ── ENVELOPE OVERLAY ── */
  #envelope-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #f3e7e8 0%, #d8c2c4 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #envelope-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .envelope-container {
    position: relative;
    width: 320px;
    height: 220px;
    background: #c89598;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
  }
  .envelope-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 160px solid transparent;
    border-right: 160px solid transparent;
    border-top: 120px solid #b27d80;
    transform-origin: top;
    transition: transform 0.6s ease;
    z-index: 3;
  }
  .envelope-container.open .envelope-flap {
    transform: rotateX(180deg);
    z-index: 1;
  }
  .envelope-pocket {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 160px solid #c89598;
    border-right: 160px solid #c89598;
    border-bottom: 110px solid #d4a3a6;
    border-radius: 0 0 10px 10px;
    z-index: 2;
  }
  .open-instruction {
    margin-top: 25px;
    font-size: 1.1rem;
    color: #5a4042;
    font-weight: 600;
    letter-spacing: 1px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ── MAIN CONTENT ── */
  .main-content {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  .main-content.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── SECTION 1: INVITATION CARD ── */
  .invite-card {
    text-align: center;
    background: #ffffff;
    padding: 50px 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    max-width: 600px;
    width: 100%;
    margin-bottom: 60px;
    border: 1px solid #f0e1e2;
  }
  .invite-subtitle {
    font-size: 0.95rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8c6d70;
    margin-bottom: 20px;
  }
  .couple-names {
    font-size: 3rem;
    font-weight: 700;
    color: #4a2e31;
    margin: 20px 0;
    animation: gentle-shake 3s ease-in-out infinite;
  }
  .couple-names span {
    display: block;
    font-size: 2rem;
    font-weight: 400;
    color: #b27d80;
    margin: 10px 0;
  }
  @keyframes gentle-shake {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-4px) rotate(-1deg); }
    75% { transform: translateY(4px) rotate(1deg); }
  }

  /* ── SECTION 2: DATE & COUNTDOWN ── */
  .date-section {
    text-align: center;
    margin-bottom: 60px;
  }
  .wedding-date {
    font-size: 1.6rem;
    color: #4a2e31;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .countdown-box {
    display: flex;
    gap: 20px;
    justify-content: center;
  }
  .time-block {
    background: #ffffff;
    padding: 15px 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.04);
    min-width: 80px;
    border: 1px solid #f0e1e2;
  }
  .time-num {
    font-size: 1.8rem;
    font-weight: 700;
    color: #b27d80;
    font-family: 'Cairo', sans-serif;
  }
  .time-lbl {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #8c6d70;
    margin-top: 5px;
    letter-spacing: 1px;
  }

  /* ── SECTION 3: WELCOME MESSAGE ── */
  .welcome-section {
    text-align: center;
    max-width: 550px;
    background: #ffffff;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    border: 1px solid #f0e1e2;
  }
  .welcome-title {
    font-size: 2rem;
    color: #4a2e31;
    margin-bottom: 15px;
  }
  .welcome-desc {
    font-size: 1.1rem;
    color: #6c5a5c;
    line-height: 1.6;
    font-family: 'Cairo', sans-serif;
  }
</style>
</head>
<body>

  <!-- شاشة الظرف الأولية -->
  <div id="envelope-screen" onclick="openEnvelope()">
    <div class="envelope-container" id="envelope">
      <div class="envelope-flap"></div>
      <div class="envelope-pocket"></div>
    </div>
    <div class="open-instruction">اضغط في أي مكان لفتح الظرف ✨</div>
  </div>

  <!-- محتوى الدعوة الأساسي -->
  <div class="main-content" id="mainContent">
    
    <!-- كارت الاسماء ودعوة الزفاف -->
    <div class="invite-card">
      <div class="invite-subtitle">You are invited to the wedding party of</div>
      <div class="couple-names">
        Ahmed
        <span>&</span>
        Yara
      </div>
    </div>

    <!-- التاريخ والعد التنازلي -->
    <div class="date-section">
      <div class="wedding-date">📅 31-7-2026</div>
      <div class="countdown-box">
        <div class="time-block">
          <div class="time-num" id="days">00</div>
          <div class="time-lbl">أيام</div>
        </div>
        <div class="time-block">
          <div class="time-num" id="hours">00</div>
          <div class="time-lbl">ساعات</div>
        </div>
        <div class="time-block">
          <div class="time-num" id="minutes">00</div>
          <div class="time-lbl">دقائق</div>
        </div>
        <div class="time-block">
          <div class="time-num" id="seconds">00</div>
          <div class="time-lbl">ثواني</div>
        </div>
      </div>
    </div>

    <!-- رسالة الترحيب -->
    <div class="welcome-section">
      <h2 class="welcome-title">Welcome!</h2>
      <p class="welcome-desc">We joyfully invite you to celebrate the beginning of our forever. Here you'll find everything you need for our special day.</p>
    </div>

  </div>

<script>
  function openEnvelope() {
    const envelope = document.getElementById('envelope');
    const screen = document.getElementById('envelope-screen');
    const main = document.getElementById('mainContent');

    if (envelope.classList.contains('open')) return;

    envelope.classList.add('open');
    
    setTimeout(() => {
      screen.classList.add('hidden');
      main.classList.add('visible');
    }, 500);
  }

  // عداد تنازلي لحد يوم 31 يوليو 2026
  const weddingDate = new Date('July 31, 2026 00:00:00').getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const gap = weddingDate - now;

    if (gap > 0) {
      const second = 1000;
      const minute = second * 60;
      const hour = minute * 60;
      const day = hour * 24;

      document.getElementById('days').innerText = Math.floor(gap / day);
      document.getElementById('hours').innerText = Math.floor((gap % day) / hour);
      document.getElementById('minutes').innerText = Math.floor((gap % hour) / minute);
      document.getElementById('seconds').innerText = Math.floor((gap % minute) / second);
    }
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();
</script>

</body>
</html>
