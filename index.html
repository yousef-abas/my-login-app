<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة التجار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#6b7794;--bd:#e3e8f2;--pri:#4f46e5;--pri2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--sh:0 4px 18px rgba(20,33,61,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f35;--tx:#e8ecf8;--mut:#93a0c4;--bd:#27314f;--sh:0 4px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f35;--tx:#e8ecf8;--mut:#93a0c4;--bd:#27314f;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:1.5rem;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:.85rem}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;font:inherit;font-size:.9rem;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--pri)}
.btn.p{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;border:0;font-weight:700}
.btn.d{color:var(--bad)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.search{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:12px;box-shadow:var(--sh)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mut);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:.85rem;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip b{margin-inline-start:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-3px);border-color:var(--pri)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.sid{color:var(--mut);font-size:.8rem;direction:ltr;text-align:right}
.badge{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.issue{font-size:.85rem;color:var(--mut)}
.prog{height:7px;background:var(--bd);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .4s}
.last{font-size:.82rem;background:color-mix(in srgb,var(--mut) 9%,transparent);padding:8px 10px;border-radius:10px;min-height:38px}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--mut)}
.foot a{color:var(--pri);text-decoration:none;margin-inline-start:10px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:60px 10px;grid-column:1/-1}
dialog{border:0;border-radius:18px;padding:0;width:min(640px,94vw);max-height:92vh;background:var(--card);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,30,.55);backdrop-filter:blur(3px)}
.dh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-weight:700}
.db{padding:16px 20px;overflow-y:auto;max-height:68vh;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{font-size:.8rem;color:var(--mut);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus,.search:focus{outline:2px solid var(--pri);outline-offset:-1px}
.ltr{direction:ltr;text-align:right}
.df{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:space-between}
.tl{border-inline-start:2px solid var(--bd);margin:0;padding:0 14px 0 0;list-style:none}
.tl li{position:relative;padding:0 0 12px;font-size:.85rem}
.tl li::before{content:"";position:absolute;inset-inline-start:-21px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.tl small{color:var(--mut);display:block}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s}
.toast.on{opacity:1}
@media(max-width:560px){.db{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>📋 متابعة التجار</h1><div class="sub" id="sub"></div></div>
    <div class="bar">
      <button class="btn" id="exp">تصدير نسخة</button>
      <button class="btn" id="imp">استيراد</button>
      <button class="btn p" id="add">+ تاجر جديد</button>
    </div>
  </header>
  <input class="search" id="q" placeholder="🔍 ابحث بالاسم أو Seller ID أو رقم التليفون أو المشكلة...">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</div>

<dialog id="dlg">
  <div class="dh"><span id="dt">تاجر جديد</span><button class="btn" id="x">✕</button></div>
  <div class="db">
    <div><label>Seller ID</label><input id="f_sid" class="ltr" autocomplete="off"></div>
    <div><label>اسم التاجر (Seller Name)</label><input id="f_name"></div>
    <div><label>رقم التليفون</label><input id="f_phone" class="ltr" inputmode="tel"></div>
    <div><label>نوع المشكلة</label><select id="f_issue"></select></div>
    <div class="full"><label>تفاصيل المشكلة</label><textarea id="f_det" rows="2"></textarea></div>
    <div class="full"><label>المرحلة الحالية</label><select id="f_stage"></select></div>
    <div class="full"><label>تحديث جديد / ملاحظة (هتتسجل في السجل بتاريخها)</label><textarea id="f_note" rows="2" placeholder="مثال: كلمته النهاردة وبعت المستندات المطلوبة..."></textarea></div>
    <div class="full" id="tlbox"><label>سجل المتابعة</label><ul class="tl" id="tl"></ul></div>
  </div>
  <div class="df"><button class="btn d" id="del">🗑 حذف</button><button class="btn p" id="save">حفظ</button></div>
</dialog>
<input type="file" id="file" accept="application/json" hidden>
<div class="toast" id="toast"></div>

<script>
const KEY='sellerTracker.v1';
const STAGES=[
 {k:'new',l:'جديد',c:'#64748b',p:8},
 {k:'contacted',l:'تم التواصل',c:'#0ea5e9',p:25},
 {k:'waiting',l:'مستني رد التاجر',c:'#d97706',p:42},
 {k:'poa',l:'اتقدمت خطة التصحيح (POA)',c:'#7c3aed',p:62},
 {k:'review',l:'تحت المراجعة',c:'#4f46e5',p:82},
 {k:'done',l:'اتحل / اتفعّل ✅',c:'#16a34a',p:100},
 {k:'rejected',l:'مرفوض ❌',c:'#dc2626',p:100}
];
const ISSUES=['إيقاف الحساب','AHR منخفض','إيقاف ASIN','توثيق / تحقق هوية','شكوى مخالفة','أخرى'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const st=k=>STAGES.find(s=>s.k===k)||STAGES[0];
let data=[],filter='all',cur=null;
try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('⚠️ التخزين مش متاح، صدّر نسخة احتياطية')}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
const fd=t=>new Date(t).toLocaleString('ar-EG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
$('f_issue').innerHTML=ISSUES.map(i=>`<option>${i}</option>`).join('');
$('f_stage').innerHTML=STAGES.map(s=>`<option value="${s.k}">${s.l}</option>`).join('');

function render(){
  const q=$('q').value.trim().toLowerCase();
  const cnt=k=>data.filter(d=>d.stage===k).length;
  $('chips').innerHTML=`<button class="chip ${filter==='all'?'on':''}" data-k="all">الكل<b>${data.length}</b></button>`+
    STAGES.map(s=>`<button class="chip ${filter===s.k?'on':''}" data-k="${s.k}">${s.l}<b>${cnt(s.k)}</b></button>`).join('');
  const open=data.filter(d=>d.stage!=='done'&&d.stage!=='rejected').length;
  $('sub').textContent=`${data.length} تاجر • ${open} قضية مفتوحة • ${cnt('done')} اتحلت`;
  const list=data.filter(d=>(filter==='all'||d.stage===filter)&&(!q||[d.sid,d.name,d.phone,d.issue,d.det].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>b.updated-a.updated);
  $('grid').innerHTML=list.length?list.map(d=>{const s=st(d.stage),n=d.log[d.log.length-1];
    const wa=(d.phone||'').replace(/[^\d]/g,'').replace(/^0/,'20');
    return `<div class="card" data-id="${d.id}" style="--c:${s.c}">
     <div class="top"><div><div class="nm">${esc(d.name||'بدون اسم')}</div><div class="sid">${esc(d.sid)}</div></div><span class="badge">${s.l}</span></div>
     <div class="issue">⚠️ ${esc(d.issue)}</div>
     <div class="prog"><i style="width:${s.p}%"></i></div>
     <div class="last">${n&&n.text?esc(n.text):'<span style="color:var(--mut)">مفيش ملاحظات لسه</span>'}</div>
     <div class="foot"><span>آخر تحديث: ${fd(d.updated)}</span><span>${d.phone?`<a href="tel:${esc(d.phone)}" data-a>📞</a>`:''}${wa?`<a href="https://wa.me/${wa}" target="_blank" rel="noopener" data-a>واتساب</a>`:''}</span></div>
    </div>`}).join(''):'<div class="empty">مفيش نتائج. دوس على "+ تاجر جديد" عشان تبدأ.</div>';
}
function openDlg(id){
  cur=data.find(d=>d.id===id)||null;
  $('dt').textContent=cur?cur.name||cur.sid:'تاجر جديد';
  $('f_sid').value=cur?.sid||'';$('f_name').value=cur?.name||'';$('f_phone').value=cur?.phone||'';
  $('f_issue').value=cur?.issue||ISSUES[0];$('f_det').value=cur?.det||'';$('f_stage').value=cur?.stage||'new';$('f_note').value='';
  $('del').style.display=cur?'':'none';$('tlbox').style.display=cur?'':'none';
  $('tl').innerHTML=cur?[...cur.log].reverse().map(l=>`<li><b>${esc(st(l.stage).l)}</b>${l.text?' — '+esc(l.text):''}<small>${fd(l.t)}</small></li>`).join(''):'';
  $('dlg').showModal();
}
$('save').onclick=()=>{
  const sid=$('f_sid').value.trim();
  if(!sid){toast('اكتب Seller ID الأول');return}
  if(data.some(d=>d.sid===sid&&d!==cur)){toast('الـ Seller ID ده موجود قبل كده');return}
  const now=Date.now(),stage=$('f_stage').value,note=$('f_note').value.trim();
  const o=cur||{id:'s'+now,log:[],created:now,stage:null};
  const changed=o.stage!==stage;
  Object.assign(o,{sid,name:$('f_name').value.trim(),phone:$('f_phone').value.trim(),issue:$('f_issue').value,det:$('f_det').value.trim()});
  if(changed||note)o.log.push({t:now,stage,text:note||(cur?'':'تم فتح الحالة')});
  o.stage=stage;o.updated=now;
  if(!cur)data.push(o);
  persist();$('dlg').close();render();toast('✅ اتحفظ');
};
$('del').onclick=()=>{if(cur&&confirm('متأكد إنك عايز تمسح التاجر ده؟')){data=data.filter(d=>d!==cur);persist();$('dlg').close();render()}};
$('x').onclick=()=>$('dlg').close();
$('add').onclick=()=>openDlg(null);
$('q').oninput=render;
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(b){filter=b.dataset.k;render()}};
$('grid').onclick=e=>{if(e.target.closest('[data-a]'))return;const c=e.target.closest('.card');if(c)openDlg(c.dataset.id)};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='sellers-backup.json';a.click();toast('اتصدّرت النسخة')};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;data=x;persist();render();toast('✅ اتستورد')}catch(_){toast('الملف مش صالح')}};r.readAsText(f)};
render();
</script>
</body>
</html>
